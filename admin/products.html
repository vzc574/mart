<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Store manager | Debre Birhan Market</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body>
<div id="site-header"></div>
<main class="container page-main">
  <div id="admin-gate" class="empty" hidden><h2>Admins only</h2><p id="gate-text">Sign in with the store owner account to manage products.</p><a class="button blue" href="/login.html">Sign in</a></div>
  <div id="admin-app" hidden>
    <div class="admin-head"><div><span class="eyebrow blue-text">Owner tools</span><h1>Product manager</h1><p>Add, edit and stock the products customers see in your store. Prices are in ETB.</p></div><button class="button blue" id="new-product">+ Add product</button></div>
    <div class="admin-layout">
      <form id="product-form" class="admin-form">
        <h2 id="form-title">Add a product</h2>
        <input type="hidden" id="product-id">
        <label>Product name<input id="name" required minlength="2" maxlength="200" placeholder="e.g. Teff flour 5kg"></label>
        <label>Category<select id="category" required></select></label>
        <div class="form-row"><label>Price (ETB)<input id="price" type="number" min="0" step="0.01" required></label><label>Discount %<input id="discount" type="number" min="0" max="100" step="0.01" value="0"></label></div>
        <div class="form-row"><label>Stock quantity<input id="stock" type="number" min="0" step="1" value="0" required></label><label>Popularity (sort order)<input id="popularity" type="number" min="0" step="1" value="0"></label></div>
        <label>Image URL<input id="image" type="url" maxlength="2000" placeholder="https://..."></label>
        <label>Description<textarea id="description" rows="4" maxlength="5000"></textarea></label>
        <label><input id="active" type="checkbox" checked style="display:inline;width:auto"> Visible in store</label>
        <div class="form-actions"><button class="button blue" type="submit">Save product</button><button class="button ghost" type="button" id="cancel-edit">Clear</button></div>
        <p id="form-message" role="status"></p>
      </form>
      <section><div class="admin-list-head"><h2>Current products</h2><span id="admin-count"></span></div><div id="admin-products" class="admin-products"></div></section>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/api.js"></script><script src="/js/products.js"></script><script src="/js/main.js"></script><script src="/admin/admin.js"></script>
</body></html>
