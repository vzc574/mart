<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Debre Birhan Market</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container page-main"><div class="admin-form" style="max-width:430px;margin:60px auto"><a class="logo blue-text" href="index.html">Debre Birhan Market</a><h1>Create account</h1><form id="register-form"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone<input name="phone" type="tel" required placeholder="+251 9..." autocomplete="tel"></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="button blue">Register</button><p id="message" role="alert"></p></form><a href="login.html">Already have an account?</a></div></main><script src="js/api.js"></script><script src="js/auth-pages.js"></script></body></html>
