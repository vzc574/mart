<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><title>Checkout | Debre Birhan Market</title></head><body><div id="site-header"></div><main class="container page-main"><div class="breadcrumbs"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</div><h1>Checkout</h1><form id="checkout-form" class="admin-form" style="max-width:640px"><h2>Delivery and payment</h2><label>Region<input name="region" value="Amhara" required maxlength="100"></label><label>City<input name="city" value="Debre Birhan" required maxlength="100"></label><label>Neighborhood / kebele<input name="neighborhood" maxlength="200"></label><label>Street or landmark<textarea name="landmark" required maxlength="500" placeholder="e.g. Near the main bus station, blue gate"></textarea></label><label>Delivery type<select name="deliveryType"><option value="local">Debre Birhan local delivery</option><option value="nationwide">Nationwide delivery — quote required</option></select></label><label>Payment method<select name="paymentMethod"></select></label><p id="bank-info"></p><button class="button blue" type="submit">Place order</button><p id="checkout-message" role="status"></p></form></main><div id="site-footer"></div><script src="js/api.js"></script><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/checkout.js"></script></body></html>
